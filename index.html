<!DOCTYPE html>
<html lang="en" class="wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://geo-challenge.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '1']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/geo-challenge.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./images/mountain.svg" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <element-app></element-app>
    <script type="module">
      import { registerTranslation } from "@shoelace-style/localize";
      import fr from "./translations/fr";
      import en from "./translations/en";
      import de from "./translations/de";

      registerTranslation(en, fr, de);

      const langs = ["fr", "de", "en"];

      const lang = new URL(location).searchParams.get("lang");
      if (lang && langs.includes(lang)) {
        document.documentElement.lang = lang;
      } else {
        for (const lang of navigator.languages) {
          const code = lang.substring(0, 2);
          if (langs.includes(code)) {
            document.documentElement.lang = code;
            break;
          }
        }
      }

      import "./components/element-app";
    </script>
  </body>
</html>
