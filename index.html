<!DOCTYPE html>
<html lang="en" class="wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <title>Geo Challenge</title>
    <meta name="description" content="Geo Challenge - Geography Guessing Game" />
    <meta property="og:title" content="Geo Challenge" />
    <meta property="og:description" content="Geo Challenge - Geography Guessing Game" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://geo-challenge.labs.camptocamp.com/" />
    <meta property="og:image" content="https://geo-challenge.labs.camptocamp.com/images/tutorial/step4-result.png" />
    <link rel="canonical" href="https://geo-challenge.labs.camptocamp.com/" />
    <link rel="alternate" hreflang="fr" href="https://geo-challenge.labs.camptocamp.com/?lang=fr" />
    <link rel="alternate" hreflang="de" href="https://geo-challenge.labs.camptocamp.com/?lang=de" />
    <link rel="alternate" hreflang="en" href="https://geo-challenge.labs.camptocamp.com/?lang=en" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Matomo Tag Manager -->
    <script>
      var _mtm = window._mtm = window._mtm || [];
      _mtm.push({'mtm.startTime': (new Date().getTime()), 'event': 'mtm.Start'});
      (function() {
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/camptocamp.matomo.cloud/container_RZ8TYx4M.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Tag Manager -->
    <link rel="icon" type="image/svg+xml" href="./images/mountain.svg" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <element-app></element-app>
    <script type="module">
      import { registerTranslation } from "@shoelace-style/localize";
      import fr from "./translations/fr";
      import en from "./translations/en";
      import de from "./translations/de";

      registerTranslation(en, fr, de);

      const langs = ["fr", "de", "en"];

      const lang = new URL(location).searchParams.get("lang");
      if (lang && langs.includes(lang)) {
        document.documentElement.lang = lang;
      } else {
        for (const lang of navigator.languages) {
          const code = lang.substring(0, 2);
          if (langs.includes(code)) {
            document.documentElement.lang = code;
            break;
          }
        }
      }

      import "./components/element-app";
    </script>
  </body>
</html>
